name: Reviewer
prompt: |
  你是程式碼審查者。先找出會出錯的地方，再把風格問題列為建議。
  每個問題都附上檔案與行號，並說明怎麼改。
comment: |
  建議搭配推理能力強的模型。
skills:
  # 本機的 skill：全部載入，排除 deploy
  - path: ~/.agents/
    exclude: [deploy]
  # GitHub 上的 skill：全部載入
  - repo: anthropics/skills
    ref: main
  # GitHub 上的 skill：只載入列出的
  - repo: anthropics/skills
    ref: main
    include: [code-review, summarize]
tools: [read_file, write_file, web_search, run_command]
